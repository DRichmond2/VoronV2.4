[AFC_buffer Turtle_1]
advance_pin: ^PG14    # set advance pin
trailing_pin: ^PG15  # set trailing pin
multiplier_high: 1.1   # default 1.05, factor to feed more filament
multiplier_low:  0.95   # default 0.95, factor to feed less filament
