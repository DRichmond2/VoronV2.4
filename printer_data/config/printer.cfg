####################################################################################
# 	Shake & Tune
####################################################################################

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
# keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
# timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
# measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
# max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
# dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

#####################################################################
#   Macros
#####################################################################
[pause_resume]

[display_status]

[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30  

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
  
    # - Homing -
    # - Home if not alreaded homed 
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        STATUS_LEVELING
        G28
    {% endif %}
    # ----- QUAD GANTRY LEVELING -----------------------------
    {% if printer.quad_gantry_level.applied|lower == 'false' %}
        {% if V %}
            RESPOND MSG="QGL..."
        {% endif %}
        STATUS_HOMING
        QUAD_GANTRY_LEVEL
    {% endif %}
    G28
    STATUS_READY
#    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32
   
[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
# gcode:
#     G32                            ; home all axes
#     G90                            ; absolute positioning
#     G1 Z20 F3000                   ; move nozzle away from bed
gcode:

    {% set EXTRUDER_TEMP = params.EXTRUDER|float %}
    {% set BED_TEMP = params.BED|float %}
    {% set S_EXTRUDER_TEMP = 150|float %}
    {% set initial_tool = params.TOOL|int %}
    NEVERMORE_ON
    G92 E0              
    M104 S150
    BED_MESH_CLEAR    ; Clear Bed Mesh
    STATUS_HOMING                     ; Set SB Leds to "Homeing"
    G32                               ; Home                         
#    STATUS_LEVELING                   ; Set SB Leds to "Levelling"
#    QUAD_GANTRY_LEVEL                 ; QGL
#    STATUS_HOMING                     ; Set SB Leds to "Homing
#    G28                               ; Home
    M104 S175
#    clean_nozzle                      ; run nozzle cleaning macro
    AFC_BRUSH
    M109 S150
    G28 Z
#    STATUS_HEATING                    ; Set SB Leds to "Heating"
    M104 S{S_EXTRUDER_TEMP}          ; Set extruder to waiting temperature before final homing
    #BED_MESH_PROFILE LOAD=default    
    M82                               ; Set to Absolute distance 
    G0 Z20 F3000                      ; Move up 20mm
    M190 S{BED_TEMP}                  ; set and wait for bed to reach temp
    STATUS_MESHING
    BED_MESH_CALIBRATE ADAPTIVE=1               ; KAMP meshing
#    SMART_PARK
#    BED_MESH_PROFILE load="hot"    
    AFC_PARK
    STATUS_HEATING
    M109 S{EXTRUDER_TEMP}             ; set and wait for hot end to reach temp
    G92 E0 ;Reset Extruder
    T{initial_tool}
    STATUS_PRINTING
    


    G1 Z2.0 F3000 ;Move Z Axis up

    # Purge Line

    # G1 X10.1 Y20 Z0.28 F5000.0 ;Move to start position
    # G1 X10.1 Y200.0 Z0.28 F1500.0 E15 ;Draw the first line
    # G1 X10.4 Y200.0 Z0.28 F5000.0 ;Move to side a little
    # G1 X10.4 Y20 Z0.28 F1500.0 E30 ;Draw the second line
    # G92 E0 ;Reset Extruder

    G90
#    G0 X150 Y150 Z30 F3000    
    M83

    LINE_PURGE

#    SFS_ENABLE

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}
#    {% set z_safe = th.axis_maximum.z %}
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
#    SFS_DISABLE
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-1.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X0 Y{th.axis_maximum.y//2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR
    SET_AFC_TOOLCHANGES TOOLCHANGES=0
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=600
    STATUS_READY


[gcode_macro LOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set temperature = params.TEMP|default(210) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=load_state
    M117 Filament Load 
    M118 Filament Loading
    M118 Homing & QGL
    # ----- QUAD GANTRY LEVELING -----------------------------
    {% if printer.quad_gantry_level.applied|lower == 'false' %}
        {% if V %}
            RESPOND MSG="QGL..."
        {% endif %}
        STATUS_HOMING
        G32
    {% endif %}
    G90
    M118 Moving to purge bucket
    G0 X175 Y300 Z15 F7200
    G0 X135 Y355 Z10 F3600
    M118 Heating
    M109 S{temperature}
    G91
    G92 E0
    M118 Loading Filament
    G1 E100 F{max_velocity} # fast-load
    G1 E25 F{speed} # purge
    M118 Cleaning Nozzle
    clean_nozzle
    M118 Filament Loaded
    M117
    M104 S0
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set temperature = params.TEMP|default(210) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=unload_state
    M117 Filament Unload 
    M118 Filament Unloading
    G32
    G90
    M118 Moving to purge bucket
    G0 X175 Y300 Z15 F7200
    G0 X215 Y355 Z10 F3600
    M109 S{temperature}
    G91
    G92 E0
    M118 Unloading Filament
    G1 E25 F{speed} # purge
    G1 E-60 F{max_velocity} # fast-unload
    M118 Filament Unloaded
    M117
    M104 S0
    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(10)|float %}
    {% set Z = params.Z|default(100)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F6000
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state




# Cancel object (aka Marlin/RRF M486 commands) support
#
# Enable object exclusion
[exclude_object]

[gcode_macro M486]
gcode:
  # Parameters known to M486 are as follows:
  #   [C<flag>] Cancel the current object
  #   [P<index>] Cancel the object with the given index
  #   [S<index>] Set the index of the current object.
  #       If the object with the given index has been canceled, this will cause
  #       the firmware to skip to the next object. The value -1 is used to
  #       indicate something that isn’t an object and shouldn’t be skipped.
  #   [T<count>] Reset the state and set the number of objects
  #   [U<index>] Un-cancel the object with the given index. This command will be
  #       ignored if the object has already been skipped

  {% if 'exclude_object' not in printer %}
    {action_raise_error("[exclude_object] is not enabled")}
  {% endif %}

  {% if 'T' in params %}
    EXCLUDE_OBJECT RESET=1

    {% for i in range(params.T | int) %}
      EXCLUDE_OBJECT_DEFINE NAME={i}
    {% endfor %}
  {% endif %}

  {% if 'C' in params %}
    EXCLUDE_OBJECT CURRENT=1
  {% endif %}

  {% if 'P' in params %}
    EXCLUDE_OBJECT NAME={params.P}
  {% endif %}

  {% if 'S' in params %}
    {% if params.S == '-1' %}
      {% if printer.exclude_object.current_object %}
        EXCLUDE_OBJECT_END NAME={printer.exclude_object.current_object}
      {% endif %}
    {% else %}
      EXCLUDE_OBJECT_START NAME={params.S}
    {% endif %}
  {% endif %}

  {% if 'U' in params %}
    EXCLUDE_OBJECT RESET=1 NAME={params.U}
  {% endif %}

[gcode_macro clean_nozzle]
gcode:
  {% set wipe_count = 8 %}
  SAVE_GCODE_STATE NAME=clean_nozzle_state
  G90
  G0 X175 Y300 Z15 F7200
#  M109 S200
  {% for wipe in range(wipe_count) %}
    {% for coordinate in [(150,355),(195, 355)] %}
      G0 X{coordinate[0] + 0.25 * wipe} Y{coordinate[1]} Z9 F12000
    {% endfor %}
  {% endfor %}
  M109 S0
  RESTORE_GCODE_STATE NAME=clean_nozzle_state

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

