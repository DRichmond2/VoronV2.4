# ##  34.37086 for Bondtech 8mm gears (Galileo)
# rotation_distance: 47.088   #Bondtech 5mm Drive Gears
# #rotation_distance: 21.525   #Bondtech 5mm Drive Gears
# ##  Update Gear Ratio depending on your Extruder Type
# ##  Use 50:10 for Stealthburner/Clockwork 2
# ##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
# ##  Use 80:20 for M4, M3.1
# ##  Use 7.5:1 for Galileo
# gear_ratio: 9:1
# #gear_ratio: 50:10               #BMG Gear Ratio
# microsteps: 16
# full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
# nozzle_diameter: 0.400
# filament_diameter: 1.75
# ##      In E0 OUT Position
# heater_pin: PA2
# ## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
# ## Use "Generic 3950" for NTC 100k 3950 thermistors
# # sensor_type: ATC Semitec 104GT-2 - Phateus Dragonfly HF
# sensor_type: ATC Semitec 104NT-4-R025H42G
# sensor_pin: PF4
# min_temp: -100
# max_temp: 350
# max_power: 1.0
# min_extrude_temp: 170
# max_extrude_only_distance: 100
# max_extrude_cross_section: 5
# #control = pid
# #pid_kp = 26.213
# #pid_ki = 1.304
# #pid_kd = 131.721
# ##  Try to keep pressure_advance below 1.0
# pressure_advance: 0.04
# ##  Default is 0.040, leave stock
# pressure_advance_smooth_time: 0.040

# ##  In E0-MOT Position
# ##  Make sure to update below for your relevant driver (2208 or 2209)
# [tmc2209 extruder]
# uart_pin: PC7
# interpolate: false
# run_current: 0.6
# sense_resistor: 0.110
# stealthchop_threshold: 0

[firmware_retraction]
retract_length: 0.35
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 30
#   The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 30
#   The speed of unretraction, in mm/s. The default is 10 mm/s.

#####################################################################
#   Bed Heater
#####################################################################
##  SSR Pin - In BED OUT position
[heater_bed]
heater_pin: PA3
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for Keenovo heaters
sensor_type: Generic 3950
sensor_pin: PF3
##  Adjust Max Power so your heater doesn't warp your bed
max_power: 1.0
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   Probe
#####################################################################

##  This probe is not used for Z height, only Quad Gantry Leveling
##  In Z+ position
[probe]
##  If your probe is NO instead of NC, change pin to ^!PA3
# SB2209 (RP0240)
# pin: ^!EBBCan:gpio22 
# EBB36
pin:^!EBBCan:PB6 
x_offset: 0
y_offset: 0
#z_offset: 0
speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.1
samples_tolerance_retries: 5

activate_gcode:
    {% set PROBE_TEMP = 170 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}
    

#####################################################################
#   Fan Control
#####################################################################

# ##  Hotend Fan - FAN0 Connector
# [heater_fan hotend_fan]
# #[fan_generic hotend_fan]
# ##  Select pin for your Spider board
# ##--------------------------------------------------------------------
# # pin: PB0   # Spider 1.0 & 1.1
# # pin: PA13  # Spider 2.2
# pin: PE5
# ##--------------------------------------------------------------------
# max_power: 1.0
# kick_start_time: 0.5
# heater: extruder
# heater_temp: 50.0
# ##  If you are experiencing back flow, you can reduce fan_speed
# #fan_speed: 1.0

# ##  Print Cooling Fan - FAN1 Connector
# [fan]
# ##--------------------------------------------------------------------
# #pin: PB1   # Spider 1.0 & 1.1
# #pin: PA14  # Spider 2.2
# pin: PA8
# ##--------------------------------------------------------------------
# max_power: 1.0
# kick_start_time: 0.5
# ##  Depending on your fan, you may need to increase this value
# ##  if your fan will not start. Can change cycle_time (increase)
# ##  if your fan is not able to slow down effectively
# off_below: 0.10

[multi_pin Bottom_Section_Fans]
pins: PD12, PD13

##  Controller fan - FAN2 Connector
# [temperature_fan controller]
# pin: multi_pin:Bottom_Section_Fans
# kick_start_time: 0.1
# sensor_type: temperature_host
# min_temp: 0
# max_temp: 100.0                #Set below 85C, Pi3+ MCU can be damaged at 85C
# target_temp: 65.0             #Set this to your preferred running temperature
# off_below: 0.20
# max_speed: 0.55
# min_speed: 0.0
# control: watermark
# max_delta: 5
# shutdown_speed: 0.0
# # pid_Kp: 2.0
# # pid_Ki: 5.0
# # pid_Kd: 0.5
# # pid_deriv_time: 2.0

[heater_fan controller_1]
pin: multi_pin:Bottom_Section_Fans
kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0
#off_below: 40.0
fan_speed: 0.55



#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 3600

[safe_z_home]
##  XY Location of the Z Endstop Switch
##  Update -10,-10 to the XY coordinates of your endstop pin 
##  (such as 157,305) after going through Z Endstop Pin
##  Location Definition step.
# home_xy_position:232,353
home_xy_position:175,300
speed:100
z_hop:10

##  Use QUAD_GANTRY_LEVEL to level a gantry.
##  Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##  MAX (250, 250), (300,300), or (350,350) depending on your printer size
##  to respective belt positions
[quad_gantry_level]

gantry_corners:
   -60,-10
   410,420
##  Probe points
points:
   50,25
   50,275
   300,275
   300,25
 
speed: 100
horizontal_move_z: 12
retries: 5
retry_tolerance: 0.0075
max_adjust: 15

[bed_mesh]
speed: 100
horizontal_move_z: 8
mesh_min: 10, 10
mesh_max: 340,340
fade_start: 0.6
fade_end: 10.0
fade_target: 0
probe_count: 8, 8
algorithm: bicubic
#relative_reference_index: 12

#####################################################################
#   Temperature Sensors
#####################################################################

[temperature_sensor BTT_Octopus]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100

[temperature_sensor Pi]
sensor_type: temperature_host
sensor_path:/sys/class/thermal/thermal_zone0/temp
min_temp: 0
max_temp: 100

[temperature_sensor Chamber]
sensor_type: Generic 3950
sensor_pin: PF5
min_temp: 0
max_temp: 100

