[filament_switch_sensor BTT_SFS_V2-Filament_Swtich]  
switch_pin: ^PG12 
pause_on_runout: False 
runout_gcode: 
    PAUSE  #  [pause_resume] is required in printer.cfg  
    M117 Filament switch runout
    M118 Filament Runout
insert_gcode: 
    M117 Filament inserted 

# [filament_motion_sensor BTT_SFS_V2-Motion_Swtich]  
# switch_pin: ^PG13 
# detection_length: 2.8 # accuracy of motion sensor 2.88mm 
# extruder: extruder  
# pause_on_runout: False 
# runout_gcode: 
#    PAUSE  #  [pause_resume] is required in printer.cfg 
#    M117 Filament encoder runout 
#    M118 Filament Jammed or Broken
# insert_gcode: 
#    M117 Filament encoder inserted 

[delayed_gcode DISABLEFILAMENTSENSOR] ; This will disable the SFS 1 second after klipper starts
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=BTT_SFS_V2-Filament_Swtich ENABLE=0 ; Put your filament sensor's name after SENSOR=
#    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0

[gcode_macro SFS_ENABLE] ; Add this to PRINT_START
description: Enable smart filament sensor
gcode:
    M117 ENABLING the Smart Filament Sensor
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=BTT_SFS_V2-Filament_Swtich ENABLE=1 ; Put your filament sensor's name after SENSOR=
#    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
    
[gcode_macro SFS_DISABLE] ; Add this to PRINT_END and PRINT_CANCEL
description: Disable smart filament sensor
gcode:
    M117 DISABLING the Smart Filament Sensor
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=BTT_SFS_V2-Filament_Swtich ENABLE=0 ; Put your filament sensor's name after SENSOR=
#   SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0