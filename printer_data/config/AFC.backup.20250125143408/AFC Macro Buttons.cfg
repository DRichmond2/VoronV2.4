[gcode_macro LANE1_UNLOAD]
gcode:
  LANE_UNLOAD LANE=leg1

[gcode_macro LANE2_UNLOAD]
gcode:
  LANE_UNLOAD LANE=leg2

[gcode_macro LANE3_UNLOAD]
gcode:
  LANE_UNLOAD LANE=leg3

[gcode_macro LANE4_UNLOAD]
gcode:
  {% set lane_num = params.LANE|default(1)|int %}
  {% set stepper = printer['gcode_macro _AFC_GLOBAL_VARS'].stepper_name|string %}
  
  LANE_UNLOAD LANE={stepper ~ lane_num}

[gcode_macro ACTIVE_TOOL_UNLOAD]
gcode:
  M109 S230
  BT_TOOL_UNLOAD
